<header id="master-head" class="navbar menu-absolute menu-center menu-light">
    <div class="container-fluid">
        <div id="main-logo" class="logo-container">
            <a class="logo" href="./">
                <img src="images/d-code-logo-dark.svg" class="logo-dark img-fluid" alt="Propert-Ease">
                <img src="images/d-code-logo-light.svg" class="logo-light img-fluid" alt="Propert-Ease">
            </a>
        </div>
        <div class="menu-toggle-btn">
            <!--* Mobile menu toggle-->
            <a class="navbar-toggle">
                <div class="burger-lines">
                </div>
            </a>
            <!--* End mobile menu toggle-->
        </div>
        <div id="navigation" class="nav navbar-nav navbar-main">
            <ul id="main-menu" class="menu-primary">
                <li class="menu-item nav-home">
                    <a href="./">Home</a>
                </li>

                <li class="menu-item nav-about">
                    <a href="about/">About</a>
                </li>
                <li class="menu-item nav-contact">
                    <a href="contact/">Contact</a>
                </li>
            </ul>
        </div>
        <div class="navbar-right">
            <div class="menu-button" id="headerAuthContainer">
                <a href="login/">
                    <div class="btn btn-outline-primary btn-light">sign in</div>
                </a>
            </div>
        </div>
    </div>
</header>

<script>
setTimeout(function() {
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');
    const societyStr = localStorage.getItem('society');
    
    if (token || userStr) {
        let portalUrl = '#';
        try {
            if (societyStr) {
                const s = JSON.parse(societyStr);
                if (s.custom_domain) portalUrl = 'http://' + s.custom_domain;
            }
        } catch(e) {}

        const isSubpage = window.location.pathname.includes('/about/') || window.location.pathname.includes('/contact/') || window.location.pathname.includes('/register/') || window.location.pathname.includes('/login/');
        const hrefUrl = portalUrl !== '#' ? portalUrl : (isSubpage ? '../' : './');
        const targetAttr = portalUrl !== '#' ? ' target="_blank"' : '';

        $('#headerAuthContainer').html(
            '<a href="' + hrefUrl + '"' + targetAttr + '>' +
                '<div class="btn btn-outline-primary btn-light">dashboard</div>' +
            '</a>'
        );
    }
}, 150);
</script>
