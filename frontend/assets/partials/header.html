<header id="master-head" class="navbar menu-absolute menu-center menu-light">
    <div class="container-fluid">
        <div id="main-logo" class="logo-container">
            <a class="logo" href="./">
                <img src="images/d-code-logo-dark.svg" class="logo-dark img-fluid" alt="Propert-Ease">
                <img src="images/d-code-logo-light.svg" class="logo-light img-fluid" alt="Propert-Ease">
            </a>
        </div>
        <div class="menu-toggle-btn">
            <!--* Mobile menu toggle-->
            <a class="navbar-toggle">
                <div class="burger-lines">
                </div>
            </a>
            <!--* End mobile menu toggle-->
        </div>
        <div id="navigation" class="nav navbar-nav navbar-main">
            <ul id="main-menu" class="menu-primary">
                <li class="menu-item nav-home">
                    <a href="./">Home</a>
                </li>

                <li class="menu-item nav-about">
                    <a href="about/">About</a>
                </li>
                <li class="menu-item nav-contact">
                    <a href="contact/">Contact</a>
                </li>
            </ul>
        </div>
        <div class="navbar-right">
            <div class="menu-button" id="headerAuthContainer">
                <a href="login/">
                    <div class="btn btn-outline-primary btn-light">sign in</div>
                </a>
            </div>
        </div>
    </div>
</header>

<script>
// Secure Single Sign-On (SSO) Ephemeral Token Handoff Interceptor
(function() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const ssoToken = urlParams.get('sso_token');
        const ssoUser = urlParams.get('sso_user');
        const ssoSociety = urlParams.get('sso_society');
        if (ssoToken) {
            localStorage.setItem('token', ssoToken);
            if (ssoUser) localStorage.setItem('user', decodeURIComponent(ssoUser));
            if (ssoSociety) localStorage.setItem('society', decodeURIComponent(ssoSociety));
            window.history.replaceState({}, document.title, window.location.pathname);
            console.log('[SSO Handoff] Successfully authenticated session on origin:', window.location.hostname);
        }
    } catch(e) { console.error('[SSO Error] Failed handoff:', e); }
})();

window.handleGlobalLogout = function() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    localStorage.removeItem('society');
    const isSub = window.location.pathname.includes('/about/') || window.location.pathname.includes('/contact/') || window.location.pathname.includes('/register/') || window.location.pathname.includes('/login/');
    window.location.href = isSub ? '../' : './';
};

setTimeout(function() {
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');
    const societyStr = localStorage.getItem('society');
    
    if (token || userStr) {
        let firstName = 'User';
        let portalUrl = '#';
        try {
            if (userStr) {
                const u = JSON.parse(userStr);
                if (u.name) firstName = u.name.split(' ')[0];
            }
            if (societyStr) {
                const s = JSON.parse(societyStr);
                if (s.custom_domain) portalUrl = 'http://' + s.custom_domain;
            }
        } catch(e) {}

        const isSubpage = window.location.pathname.includes('/about/') || window.location.pathname.includes('/contact/') || window.location.pathname.includes('/register/') || window.location.pathname.includes('/login/');
        let hrefUrl = portalUrl !== '#' ? portalUrl : (isSubpage ? '../' : './');
        if (portalUrl !== '#' && token) {
            hrefUrl = portalUrl + '/?sso_token=' + encodeURIComponent(token) + '&sso_user=' + encodeURIComponent(userStr || '') + '&sso_society=' + encodeURIComponent(societyStr || '');
        }
        const targetAttr = portalUrl !== '#' ? ' target="_blank"' : '';

        $('#headerAuthContainer').html(
            '<div class="dropdown" style="display: inline-block;">' +
                '<div class="btn btn-outline-primary btn-light dropdown-toggle header-dropdown-btn" data-toggle="dropdown" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer; text-transform: none; display: inline-flex; align-items: center; gap: 6px;">Hi, ' + firstName + '</div>' +
                '<div class="dropdown-menu dropdown-menu-right" style="margin-top: 10px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-radius: 8px; min-width: 180px;">' +
                    '<a class="dropdown-item" href="' + hrefUrl + '"' + targetAttr + ' style="padding: 10px 20px; font-weight: 600; color: #1A4A8A; font-size: 14px;">Visit Dashboard</a>' +
                    '<div class="dropdown-divider" style="margin: 4px 0;"></div>' +
                    '<a class="dropdown-item text-danger" href="javascript:void(0)" onclick="handleGlobalLogout()" style="padding: 10px 20px; font-weight: 600; font-size: 14px;">Logout</a>' +
                '</div>' +
            '</div>'
        );

        // Real-Time Zero-Trust Background Session Verification
        if (token) {
            let apiUrl = 'https://propertease-api-do2f.onrender.com/api/v1';
            if (window.APP_CONFIG && window.APP_CONFIG.getApiBase) {
                apiUrl = window.APP_CONFIG.getApiBase() + '/api/v1';
            } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                apiUrl = 'http://127.0.0.1:5000/api/v1';
            }

            fetch(apiUrl + '/auth/verify', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => {
                if (res.status === 401 || res.status === 403) {
                    throw new Error('TOKEN_REVOKED');
                }
                return res.json();
            })
            .then(data => {
                if (data && data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    if (data.society) {
                        localStorage.setItem('society', JSON.stringify(data.society));
                    }
                }
            })
            .catch(err => {
                if (err.message === 'TOKEN_REVOKED') {
                    console.warn('[Zero-Trust Security] Inactive or revoked session detected. Forcing logout.');
                    window.handleGlobalLogout();
                } else {
                    console.warn('[Session Verify] Network/server error during verification. Preserving local session.', err);
                }
            });
        }
    }
}, 150);

$(document).on('click', '.header-dropdown-btn', function(e) {
    e.stopPropagation();
    $(this).parent('.dropdown').find('.dropdown-menu').toggleClass('show');
});
$(document).on('click', function(e) {
    if (!$(e.target).closest('.dropdown').length) {
        $('.dropdown-menu').removeClass('show');
    }
});
</script>
