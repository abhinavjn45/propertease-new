<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Contact Us — Propert-Ease | Digital Society Management</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Contact the Propert-Ease team for sales inquiries, technical support, or to schedule a demo of our RWA and CGHS governance platform." />
        <meta name="keywords" content="Contact Propert-Ease, Society Management Support, RWA SaaS Demo" />
        <meta content="Propert-Ease Team" name="author" />
        <!--* favicon -->
        <link rel="shortcut icon" href="../images/favicon.ico">
        <!--* WOW Animation -->
        <link href="../css/animate.css" rel="stylesheet" type="text/css"  />
        <!--* Bootstrap css -->
        <link href="../css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <!--* Slick Slider -->
        <link href="../css/slick.css" rel="stylesheet" type="text/css"  />
        <!--* Icons -->
        <link href="../css/materialdesignicons.min.css" rel="stylesheet" type="text/css" />
        <link href="../css/line-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="../css/fontawesome.min.css" rel="stylesheet" type="text/css" />
        <!--* Main css File -->
        <link href="../css/style.css" rel="stylesheet" type="text/css" id="theme-default" />
        <link href="../css/rtl-style.css" rel="stylesheet" type="text/css" id="rtl-theme-default" disabled="disabled" />
        <link href="../css/colors/default-color.css" rel="stylesheet" type="text/css" id="theme-color" />
    </head>
    <body>
        <!--* box-wrapper -->
        <div class="box-wrapper">
            <!--* Loader -->
            <div id="preloader">
                <div id="status">
                    <div class="d-loader">
                        <img src="../images/dcode-loader.gif" alt="Propert-Ease">
                    </div>
                </div>
            </div>
            <!--* Loader -->
            
            <div id="header-placeholder"></div>
            <!--* Main Wrapper -->
            <div id="main-wrapper" class="page-wrapper">
                <div class="inner-page-header section-padding style-dark">
                    <div class="container">
                        <div class="page-title-inner text-center clearfix">
                            <div class="heading-wrapper">
                                <h1 class="h1">Contact Us</h1>
                                <div class="lead-text">
                                    <p>Get in touch with us to see how Propert-Ease can streamline your society's governance and financial management.</p>
                                </div>
                            </div><!--* End Heading -->
                            <ul class="st-breadcrumb">
                                <li><a href="../index.html">Home</a></li>
                                <li class="active"><span>Contact Us</span></li>
                            </ul><!--* End Breadcrumb -->
                        </div><!--* Page Title Inner -->
                    </div>
                </div>
                <!--* Page Header -->
                <div class="section-padding">
                    <div class="container">
                        <div class="row clearfix">
                            <div class="col-lg-12">
                                <div class="contact-box-wrapper">
                                    <div class="form-box">
                                        <h2 class="h4">Send us a Message</h2>
                                        <div class="contact-form">
                                            <form method="post">
                                                <div class="form-row">
                                                    <div class="form-group col-md-6">
                                                        <input type="text" class="form-control" id="FirstName" placeholder="First Name" required="">
                                                    </div>
                                                    <div class="form-group col-md-6">
                                                        <input type="text" class="form-control" id="LastName" placeholder="Last Name">
                                                    </div>
                                                </div>
                                                <div class="form-group">
                                                    <input type="email" class="form-control" id="email" placeholder="Email Address" required="">
                                                </div>
                                                <div class="form-group">
                                                    <input type="text" class="form-control" id="subject" placeholder="Society Name / RWA Name" required="">
                                                </div>
                                                <div class="form-group">
                                                    <textarea class="form-control" placeholder="Tell us more about your requirements or issues"></textarea>
                                                </div>
                                                <div class="form-group">
                                                    <input type="submit" class="btn btn-primary" value="Send Message">
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                    <div class="contact-details-box style-dark">
                                        <h2 class="h4">Contact Information</h2>
                                        <div class="contact-info">
                                            <ul>
                                                <li class="address-field">New Delhi, India</li>
                                                <li class="email-field">support@propertease.in</li>
                                                <li class="phone-field">+91 98765 43210</li>
                                            </ul>
                                        </div>
                                        <div class="social-media-links">
                                            <ul>
                                                <li><a target="_blank" href="#"><i class="fab fa-facebook-f"></i></a></li>
                                                <li><a target="_blank" href="#"><i class="fab fa-linkedin-in"></i></a></li>
                                                <li><a target="_blank" href="#"><i class="fab fa-twitter"></i></a></li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div><!--* End Col -->
                        </div><!--* End Row -->
                    </div>
                </div>
            </div>
            <!--* Main Wrapper -->
            <div id="footer-placeholder"></div>
        </div>
        <!--* box-wrapper -->

        <!--* javascript -->
        <script src="../js/jquery.min.js"></script>
        <script src="../js/jquery-migrate.min.js"></script>
        <script src="../js/bootstrap.bundle.min.js"></script>
        <script src="../js/jquery.easing.min.js"></script>
        <script src="../js/scrollspy.min.js"></script>
        <script src="../js/appear.js"></script>
        <!--* WOW Animation -->
        <script src="../js/wow.min.js"></script>
        <!--* Slick Slider -->
        <script src="../js/slick.min.js"></script>
        
        <!--* Load Partials -->
        <script>
            $(document).ready(function() {
                var loaded = 0;
                var checkLoad = function() {
                    loaded++;
                    if (loaded === 2) {
                        // Fix relative paths for the header and footer
                        $('#header-placeholder, #footer-placeholder').find('a, img').each(function() {
                            var el = $(this);
                            var href = el.attr('href');
                            var src = el.attr('src');
                            if (href && !href.startsWith('http') && !href.startsWith('#')) {
                                el.attr('href', '../' + href);
                            }
                            if (src && !src.startsWith('http')) {
                                el.attr('src', '../' + src);
                            }
                        });
                        
                        // Apply custom classes to the loaded header for contact page
                        $('#master-head').removeClass('menu-absolute menu-light').addClass('menu-center');
                        $('#master-head .menu-button .btn').removeClass('btn-outline-primary btn-light').addClass('btn-primary');
                        $('#master-head .search-option').removeClass('style-dark');
                        
                        // Set active class for contact
                        $('#navigation .menu-item').removeClass('active');
                        $('#navigation .nav-contact').addClass('active');

                        // Load main JS after partials are in DOM and paths are fixed
                        $.getScript("../js/dcode.js", function() {
                            // Manually fade out preloader since window.load might have already fired
                            $('#status').fadeOut();
                            $('#preloader').delay(350).fadeOut('slow');
                            $('body').delay(350).css({
                                'overflow': 'visible'
                            });
                        });
                    }
                };
                
                $('#header-placeholder').load('../assets/partials/header.html', checkLoad);
                $('#footer-placeholder').load('../assets/partials/footer.html', checkLoad);
            });
        </script>
    </body>
</html>
