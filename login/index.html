<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Login — Propert-Ease | Digital Society Management</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Login to your Propert-Ease account to manage your society." />
        <meta name="keywords" content="Login, RWA Login, Propert-Ease Account" />
        <meta content="Propert-Ease Team" name="author" />
        <!--* favicon -->
        <link rel="shortcut icon" href="../images/favicon.ico">
        <!--* WOW Animation -->
        <link href="../css/animate.css" rel="stylesheet" type="text/css"  />
        <!--* Bootstrap css -->
        <link href="../css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <!--* Slick Slider -->
        <link href="../css/slick.css" rel="stylesheet" type="text/css"  />
        <!--* Icons -->
        <link href="../css/materialdesignicons.min.css" rel="stylesheet" type="text/css" />
        <link href="../css/line-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="../css/fontawesome.min.css" rel="stylesheet" type="text/css" />
        <!--* Main css File -->
        <link href="../css/style.css" rel="stylesheet" type="text/css" id="theme-default" />
        <link href="../css/rtl-style.css" rel="stylesheet" type="text/css" id="rtl-theme-default" disabled="disabled" />
        <link href="../css/colors/default-color.css" rel="stylesheet" type="text/css" id="theme-color" />
        <style>
            /* Center and resize checkboxes */
            .custom-control-label::before, 
            .custom-control-label::after {
                top: 50% !important;
                transform: translateY(-50%) !important;
                width: 1.35rem !important;
                height: 1.35rem !important;
                left: -2rem !important;
            }
            /* Add space for larger checkboxes */
            .custom-control {
                padding-left: 2rem !important;
            }
        </style>
    </head>
    <body>
        <!--* box-wrapper --> 
        <div class="box-wrapper">
            <!--* Loader -->
            <div id="preloader">
                <div id="status">
                    <div class="d-loader">
                        <img src="../images/dcode-loader.gif" alt="Propert-Ease">
                    </div>
                </div>
            </div>
            <!--* Loader -->
            <!--* Main Wrapper -->
            <div id="main-wrapper" class="page-wrapper">
                <div class="dc-signin theme-two">
                    <div class="signin-wrapper">
                        <div class="intro-box">
                            <div class="intro-content style-dark">
                                <a href="../index.html"><img src="../images/d-code-logo-light.svg" class="logo" alt="Propert-Ease"></a>
                                <div class="heading-wrapper">
                                    <h2 class="h1">Welcome to <span>Propert-Ease</span></h2>
                                </div>
                                <div class="text-wrapper">
                                    <p>Join thousands of other societies already using India's leading digital governance and financial management platform.</p>
                                </div>
                                <div class="btn-wrapper">
                                    <a class="btn btn-primary btn-light" href="../index.html">Discover More</a>
                                </div>
                            </div>
                        </div>
                        <div class="form-box">
                            <div class="register-form-container" style="padding-top: 30px;">
                                <h3 class="mb-4 text-center">Sign In to your account</h3>
                                <form>
                                    <div class="form-group">
                                        <input type="text" class="form-control" placeholder="Enter Email/Username">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control" placeholder="Enter Password">
                                    </div>
                                    <div class="mb-4 text-left" style="padding-left: 5px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
                                        <div class="custom-control custom-checkbox">
                                            <input type="checkbox" class="custom-control-input" id="rememberCheck">
                                            <label class="custom-control-label" for="rememberCheck" style="cursor: pointer;">Remember me</label>
                                        </div>
                                        <div>
                                            <a href="#" class="forgot-link" style="color: var(--primary-color);">Forgot Password?</a>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <button class="btn btn-primary btn-full">Sign In</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <!--* Page Header -->
            </div>
            <!--* Main Wrapper -->
        </div>
        <!--* box-wrapper -->
        <!--* javascript -->
        <script src="../js/jquery.min.js"></script>
        <script src="../js/jquery-migrate.min.js"></script>
        <script src="../js/bootstrap.bundle.min.js"></script>
        <script src="../js/jquery.easing.min.js"></script>
        <script src="../js/scrollspy.min.js"></script>
        <script src="../js/appear.js"></script>
        <!--* WOW Animation -->
        <script src="../js/wow.min.js"></script>
        <!--* Slick Slider -->
        <script src="../js/slick.min.js"></script>
        <!--* Main Js -->
        <script src="../js/dcode.js"></script>
    </body>
</html>
